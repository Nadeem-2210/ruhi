<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Travel Diary</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        royalBlue: '#1E3A8A',
                        terracotta: '#9A3412',
                        sand: '#FDFBF7',
                        goldAccent: '#D97706'
                    },
                    fontFamily: {
                        serif: ['Times New Roman', 'Georgia', 'serif'],
                        sans: ['Times New Roman', 'Arial', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Times New Roman', Times, serif; }
    </style>
</head>
<body class="bg-sand text-gray-800 min-h-screen flex flex-col">

    <!-- Navigation Bar -->
    <nav class="bg-sand/90 backdrop-blur-md border-b border-amber-900/20 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <a href="index.html" class="text-2xl font-bold tracking-wider text-terracotta">N & S TRAVEL DIARY</a>
            <span class="bg-royalBlue text-white text-xs px-2.5 py-1 rounded">Admin Mode</span>
        </div>
        <div>
            <a href="index.html" class="text-lg text-royalBlue hover:underline font-semibold">&larr; Back to Home</a>
        </div>
    </nav>

    <main class="flex-grow max-w-4xl mx-auto px-6 py-12 w-full">

        <!-- Login Card -->
        <div id="login-section" class="bg-white p-8 rounded-lg shadow-md border border-amber-900/10 max-w-md mx-auto space-y-6">
            <div class="text-center space-y-2">
                <h1 class="text-3xl font-serif font-bold text-royalBlue">Admin Login</h1>
                <p class="text-gray-600 text-base">Enter your PIN to manage Udaipur & Ahmedabad memories.</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-lg font-medium text-gray-700 mb-1">Passcode / PIN</label>
                    <input type="password" id="admin-pin" placeholder="Enter PIN (default: 2210)" required
                        class="w-full px-4 py-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-royalBlue text-lg">
                </div>
                <button type="submit" class="w-full bg-royalBlue text-white py-3 rounded text-lg font-semibold hover:bg-royalBlue/90 transition shadow">
                    Login to Dashboard
                </button>
            </form>
            <p class="text-xs text-center text-gray-400">Default PIN is set to <code class="bg-gray-100 px-1 py-0.5 rounded font-mono">2210</code>.</p>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard-section" class="hidden space-y-10">
            
            <div class="flex justify-between items-center border-b border-gray-300 pb-4">
                <div>
                    <h1 class="text-3xl font-serif font-bold text-royalBlue">Cloud Memory Management</h1>
                    <p class="text-gray-600 text-base">Uploads sync instantly to your live website.</p>
                </div>
                <button onclick="handleLogout()" class="text-terracotta hover:underline font-semibold text-lg">Logout</button>
            </div>

            <!-- Upload Form -->
            <div class="bg-white p-8 rounded-lg shadow-md border border-amber-900/10 space-y-6">
                <h2 class="text-2xl font-serif font-bold text-terracotta">Add New Photo Memory</h2>
                <form onsubmit="handleAddMemory(event)" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-lg font-medium text-gray-700 mb-1">Memory Title</label>
                        <input type="text" id="mem-title" placeholder="e.g., Sunset at Lake Pichola" required
                            class="w-full px-4 py-2.5 border border-gray-300 rounded focus:ring-2 focus:ring-royalBase text-lg">
                    </div>
                    <div>
                        <label class="block text-lg font-medium text-gray-700 mb-1">Location</label>
                        <select id="mem-location" class="w-full px-4 py-2.5 border border-gray-300 rounded focus:ring-2 text-lg bg-white">
                            <option value="Udaipur">Udaipur</option>
                            <option value="Ahmedabad">Ahmedabad</option>
                            <option value="Other">Other Location</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-lg font-medium text-gray-700 mb-1">Media Type</label>
                        <select id="mem-type" class="w-full px-4 py-2.5 border border-gray-300 rounded focus:ring-2 text-lg bg-white">
                            <option value="image">Image URL</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-lg font-medium text-gray-700 mb-1">Date</label>
                        <input type="date" id="mem-date" required
                            class="w-full px-4 py-2.5 border border-gray-300 rounded focus:ring-2 text-lg">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-lg font-medium text-gray-700 mb-1">Direct Image URL</label>
                        <input type="url" id="mem-url" placeholder="https://images.unsplash.com/..." required
                            class="w-full px-4 py-2.5 border border-gray-300 rounded focus:ring-2 text-lg">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-lg font-medium text-gray-700 mb-1">Description</label>
                        <textarea id="mem-desc" rows="3" placeholder="Share a short note about this memory..." required
                            class="w-full px-4 py-2.5 border border-gray-300 rounded focus:ring-2 text-lg"></textarea>
                    </div>
                    <div class="md:col-span-2">
                        <button type="submit" id="submit-btn" class="w-full bg-terracotta text-white py-3 rounded text-lg font-semibold hover:bg-terracotta/90 transition shadow">
                            Publish to Cloud
                        </button>
                    </div>
                </form>
            </div>

            <!-- Existing Memories List -->
            <div class="bg-white p-8 rounded-lg shadow-md border border-amber-900/10 space-y-6">
                <h2 class="text-2xl font-serif font-bold text-royalBlue">Manage Cloud Records</h2>
                <div id="admin-memories-list" class="space-y-4 divide-y divide-gray-200">
                    <p class="text-gray-500 py-4 text-lg">Loading records...</p>
                </div>
            </div>

        </div>

    </main>

    <!-- Admin Supabase Logic Script -->
    <script>
        // PASTE YOUR SUPABASE CREDENTIALS HERE
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const ADMIN_PIN = "2210";

        function handleLogin(e) {
            e.preventDefault();
            const pin = document.getElementById('admin-pin').value;
            if (pin === ADMIN_PIN) {
                localStorage.setItem('travel_auth', 'true');
                showDashboard();
            } else {
                alert('Incorrect PIN. Default is 2210.');
            }
        }

        function handleLogout() {
            localStorage.removeItem('travel_auth');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('admin-pin').value = '';
        }

        function showDashboard() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('mem-date').valueAsDate = new Date();
            loadAdminMemories();
        }

        async function loadAdminMemories() {
            const container = document.getElementById('admin-memories-list');
            const { data, error } = await supabaseClient
                .from('memories')
                .select('*')
                .order('date', { ascending: false });

            if (error) {
                container.innerHTML = `<p class="text-red-600 text-lg">Error loading records.</p>`;
                return;
            }

            container.innerHTML = '';
            if (!data || data.length === 0) {
                container.innerHTML = `<p class="text-gray-500 py-4 text-lg">No memories found in cloud.</p>`;
                return;
            }

            data.forEach(mem => {
                const item = document.createElement('div');
                item.className = "pt-4 first:pt-0 flex flex-col md:flex-row justify-between items-start md:items-center gap-4";
                item.innerHTML = `
                    <div class="flex items-center space-x-4">
                        <img src="${mem.url}" class="w-16 h-16 object-cover rounded border" onerror="this.src='https://via.placeholder.com/150'">
                        <div>
                            <span class="text-xs bg-royalBlue text-white px-2 py-0.5 rounded uppercase">${mem.location}</span>
                            <h3 class="text-xl font-serif font-bold text-gray-900 mt-1">${mem.title}</h3>
                            <p class="text-sm text-gray-500">${mem.date}</p>
                        </div>
                    </div>
                    <button onclick="deleteMemory(${mem.id})" class="bg-red-100 text-red-700 px-4 py-2 rounded text-base hover:bg-red-200 transition">Delete</button>
                `;
                container.appendChild(item);
            });
        }

        async function handleAddMemory(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = 'Publishing...';
            btn.disabled = true;

            const newMem = {
                title: document.getElementById('mem-title').value,
                location: document.getElementById('mem-location').value,
                type: document.getElementById('mem-type').value,
                url: document.getElementById('mem-url').value,
                date: document.getElementById('mem-date').value,
                description: document.getElementById('mem-desc').value
            };

            const { error } = await supabaseClient.from('memories').insert([newMem]);

            btn.innerText = 'Publish to Cloud';
            btn.disabled = false;

            if (error) {
                alert('Error adding memory: ' + error.message);
                return;
            }

            alert('Memory successfully published to Supabase! It is now live globally.');
            e.target.reset();
            document.getElementById('mem-date').valueAsDate = new Date();
            loadAdminMemories();
        }

        async function deleteMemory(id) {
            if (confirm('Are you sure you want to delete this memory from the cloud?')) {
                const { error } = await supabaseClient.from('memories').delete().eq('id', id);
                if (error) {
                    alert('Error deleting: ' + error.message);
                    return;
                }
                loadAdminMemories();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('travel_auth') === 'true') {
                showDashboard();
            }
        });
    </script>
</body>
</html>
